
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTC Тоҷикистон — Графики касбӣ</title>
<style>
:root{
 --bg:#080e19;--panel:#121e30;--line:#293b53;
 --text:#f2f6ff;--muted:#9badc6;
 --green:#18c88c;--red:#f15a6b;--blue:#377bf5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:15px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header strong{font-size:21px}
a{color:#a8c7ff;text-decoration:none}
main{max-width:1500px;margin:auto;padding:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
button,select{border:1px solid #3b5270;border-radius:8px;background:#1a2c44;color:white;padding:10px 13px;font-size:14px;cursor:pointer}
button.active{background:var(--blue);border-color:var(--blue)}
button:hover{filter:brightness(1.15)}
.price{font-size:25px;font-weight:800;color:var(--green);margin-left:auto}
.muted{color:var(--muted);font-size:12px}
.chartwrap{position:relative}
canvas{display:block;width:100%;touch-action:pan-y}
#chart{height:440px}
#rsi,#macd{height:110px}
#countdown{color:#f8ce63;font-weight:bold}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 0}
.indicator{font-size:13px;color:#bcd1e8;margin-bottom:6px}
@media(max-width:600px){
 #chart{height:350px}
 .price{width:100%;margin-left:0}
 main{padding:8px}
}
</style>
</head>
<body>
<header>
 <strong>📈 OTC Тоҷикистон — Chart</strong>
 <nav>
  <a href="index.html">Савдо</a> ·
  <a href="wallet.html">Ҳамён</a> ·
  <a href="otc-test.html">REAL TEST</a>
 </nav>
</header>

<main>
<div class="panel">
 <div class="toolbar">
  <select id="pair">
   <option>AUD/CHF OTC</option>
   <option>EUR/USD OTC</option>
   <option>GBP/USD OTC</option>
   <option>USD/JPY OTC</option>
   <option>EUR/JPY OTC</option>
   <option>AUD/USD OTC</option>
  </select>
  <span class="muted">Нархи ҷорӣ</span>
  <span class="price" id="price">0.62850</span>
 </div>
</div>

<div class="panel">
 <div class="toolbar" id="timeframes">
  <button data-tf="5">5s</button>
  <button data-tf="20">20s</button>
  <button data-tf="30">30s</button>
  <button data-tf="60" class="active">1m</button>
  <button data-tf="180">3m</button>
  <button data-tf="300">5m</button>
  <span class="muted">То свечаи нав:</span>
  <span id="countdown">00:00</span>
 </div>
 <div class="toolbar" style="margin-top:10px">
  <button id="zoomIn">+ Калон</button>
  <button id="zoomOut">− Хурд</button>
  <button id="reset">Барқарор</button>
  <label><input type="checkbox" id="ma" checked> MA10</label>
  <label><input type="checkbox" id="bb"> Bollinger</label>
 </div>
</div>

<div class="panel">
 <div class="legend">
  <span>🟢 Болоравӣ</span>
  <span>🔴 Поёнравӣ</span>
  <span>🟡 MA10</span>
  <span>Нархҳо дар тарафи рост</span>
 </div>
 <div class="chartwrap">
  <canvas id="chart"></canvas>
 </div>
</div>

<div class="panel">
 <div class="indicator">RSI (14)</div>
 <canvas id="rsi"></canvas>
</div>

<div class="panel">
 <div class="indicator">MACD (12, 26, 9)</div>
 <canvas id="macd"></canvas>
</div>

<p class="muted">
 Нархҳо синтетикӣ ва танҳо барои омӯзиш мебошанд.
 Ин график маълумоти воқеии биржаро нишон намедиҳад.
</p>
</main>

<script>
"use strict";

const $=id=>document.getElementById(id);
const BASE={
 "AUD/CHF OTC":0.62850,
 "EUR/USD OTC":1.08450,
 "GBP/USD OTC":1.27350,
 "USD/JPY OTC":149.250,
 "EUR/JPY OTC":161.720,
 "AUD/USD OTC":0.65420
};

let timeframe=60;
let visible=55;
let price=BASE[$("pair").value];
let ticks=[];
let candles=[];
let lastSecond=0;

const MAX_TICKS=22000;
const MAX_BARS=300;

function decimals(){
 return $("pair").value.includes("JPY")?3:5;
}
function format(n){
 return Number(n).toFixed(decimals());
}
function candleDuration(){
 return timeframe*1000;
}
function randomMove(){
 return (Math.random()-.5)*price*0.0004;
}
function makeHistory(){
 const now=Date.now();
 const step=1000;
 const total=18000;
 let p=BASE[$("pair").value];
 ticks=[];

 for(let i=total-1;i>=0;i--){
  p=Math.max(.00001,p+randomMove());
  ticks.push({t:now-i*step,p});
 }
 price=p;
 rebuild();
}
function rebuild(){
 const buckets=new Map();

 for(const tick of ticks){
  const key=Math.floor(tick.t/candleDuration());
  let bar=buckets.get(key);
  if(!bar){
   bar={
    t:key*candleDuration(),
    open:tick.p,high:tick.p,
    low:tick.p,close:tick.p
   };
   buckets.set(key,bar);
  }else{
   bar.high=Math.max(bar.high,tick.p);
   bar.low=Math.min(bar.low,tick.p);
   bar.close=tick.p;
  }
 }

 candles=[...buckets.values()].slice(-MAX_BARS);
 drawAll();
}

function setupCanvas(id){
 const el=$(id);
 const box=el.getBoundingClientRect();
 const ratio=window.devicePixelRatio||1;
 const w=Math.max(1,box.width);
 const h=Math.max(1,box.height);

 el.width=Math.round(w*ratio);
 el.height=Math.round(h*ratio);

 const ctx=el.getContext("2d");
 ctx.setTransform(ratio,0,0,ratio,0,0);
 return {ctx,w,h};
}

function ema(values,n){
 if(!values.length)return [];
 let e=values[0],k=2/(n+1);
 return values.map(v=>e=v*k+e*(1-k));
}
function sma(values,n){
 return values.map((v,i)=>{
  if(i<n-1)return null;
  let sum=0;
  for(let j=i-n+1;j<=i;j++)sum+=values[j];
  return sum/n;
 });
}
function rsi(values,n=14){
 const result=Array(values.length).fill(null);
 if(values.length<=n)return result;
 let gains=0,losses=0;
 for(let i=1;i<=n;i++){
  const d=values[i]-values[i-1];
  gains+=Math.max(d,0);
  losses+=Math.max(-d,0);
 }
 gains/=n;losses/=n;
 const value=()=>losses===0?
  (gains===0?50:100):
  100-100/(1+gains/losses);
 result[n]=value();
 for(let i=n+1;i<values.length;i++){
  const d=values[i]-values[i-1];
  gains=(gains*(n-1)+Math.max(d,0))/n;
  losses=(losses*(n-1)+Math.max(-d,0))/n;
  result[i]=value();
 }
 return result;
}
function bollinger(values,n=20){
 return values.map((v,i)=>{
  if(i<n-1)return null;
  const part=values.slice(i-n+1,i+1);
  const mean=part.reduce((a,b)=>a+b,0)/n;
  const variance=part.reduce(
   (s,x)=>s+(x-mean)**2,0
  )/n;
  const sd=Math.sqrt(variance);
  return {upper:mean+2*sd,lower:mean-2*sd};
 });
}

function drawLine(ctx,values,x,y,color,width=1.6){
 ctx.strokeStyle=color;
 ctx.lineWidth=width;
 ctx.beginPath();
 let started=false;
 values.forEach((v,i)=>{
  if(v===null||!Number.isFinite(v)){
   started=false;return;
  }
  if(!started){
   ctx.moveTo(x(i),y(v));started=true;
  }else ctx.lineTo(x(i),y(v));
 });
 ctx.stroke();
}

function drawChart(){
 const {ctx,w,h}=setupCanvas("chart");
 const data=candles.slice(-visible);
 if(!data.length)return;

 const right=86,top=22,bottom=30;
 const plotW=Math.max(10,w-right);
 const plotH=h-top-bottom;
 const highs=data.map(c=>c.high);
 const lows=data.map(c=>c.low);
 const closes=data.map(c=>c.close);

 const bb=bollinger(closes,20);
 let hi=Math.max(...highs);
 let lo=Math.min(...lows);

 if($("bb").checked){
  for(const b of bb){
   if(!b)continue;
   hi=Math.max(hi,b.upper);
   lo=Math.min(lo,b.lower);
  }
 }

 const padding=Math.max((hi-lo)*.12,price*.00005);
 hi+=padding;lo-=padding;
 const range=Math.max(hi-lo,.00000001);
 const y=v=>top+(hi-v)/range*plotH;
 const step=plotW/data.length;
 const x=i=>(i+.5)*step;

 ctx.font="12px Arial";
 ctx.textAlign="right";
 for(let i=0;i<=6;i++){
  const v=hi-(hi-lo)*i/6;
  const yy=y(v);
  ctx.strokeStyle="#26354b";
  ctx.beginPath();
  ctx.moveTo(0,yy);
  ctx.lineTo(plotW,yy);
  ctx.stroke();
  ctx.fillStyle="#b7c8dd";
  ctx.fillText(format(v),w-7,yy+4);
 }

 data.forEach((c,i)=>{
  const xx=x(i);
  const color=c.close>=c.open?
   "#18c88c":"#f15a6b";
  ctx.strokeStyle=color;
  ctx.fillStyle=color;
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(xx,y(c.high));
  ctx.lineTo(xx,y(c.low));
  ctx.stroke();
  const a=y(c.open),b=y(c.close);
  ctx.fillRect(
   xx-step*.33,Math.min(a,b),
   Math.max(2,step*.66),
   Math.max(1,Math.abs(a-b))
  );
 });

 if($("ma").checked){
  drawLine(ctx,sma(closes,10),x,y,"#f4c94d",2);
 }
 if($("bb").checked){
  drawLine(ctx,bb.map(b=>b?b.upper:null),
   x,y,"#8f9cff");
  drawLine(ctx,bb.map(b=>b?b.lower:null),
   x,y,"#8f9cff");
 }

 // Хати нархи ҷорӣ
 const currentY=y(price);
 ctx.setLineDash([5,4]);
 ctx.strokeStyle="#66baff";
 ctx.beginPath();
 ctx.moveTo(0,currentY);
 ctx.lineTo(plotW,currentY);
 ctx.stroke();
 ctx.setLineDash([]);
 ctx.fillStyle="#2260a5";
 ctx.fillRect(plotW,currentY-11,right,22);
 ctx.fillStyle="#fff";
 ctx.textAlign="right";
 ctx.fillText(format(price),w-7,currentY+4);

 // Вақти свечаҳо дар поёни график
 ctx.fillStyle="#9badc6";
 ctx.textAlign="center";
 for(let i=0;i<data.length;i+=Math.max(
  1,Math.ceil(data.length/6)
 )){
  const date=new Date(data[i].t);
  ctx.fillText(
   date.toLocaleTimeString("tg-TJ",{
    hour:"2-digit",minute:"2-digit",
    second:"2-digit",hour12:false
   }),
   x(i),h-8
  );
 }
}

function drawRSI(){
 const {ctx,w,h}=setupCanvas("rsi");
 const values=candles.map(c=>c.close);
 const rv=rsi(values).slice(-visible);
 const right=86,plotW=w-right;
 const x=i=>(i+.5)*plotW/Math.max(1,rv.length);
 const y=v=>(100-v)/100*(h-12)+6;

 ctx.font="11px Arial";
 [30,50,70].forEach(level=>{
  ctx.strokeStyle="#2d3d55";
  ctx.beginPath();
  ctx.moveTo(0,y(level));
  ctx.lineTo(plotW,y(level));
  ctx.stroke();
  ctx.fillStyle="#aabbd0";
  ctx.fillText(String(level),plotW+8,y(level)+4);
 });
 drawLine(ctx,rv,x,y,"#e5c45a",2);
}

function drawMACD(){
 const {ctx,w,h}=setupCanvas("macd");
 const values=candles.map(c=>c.close);
 if(!values.length)return;

 const fast=ema(values,12);
 const slow=ema(values,26);
 const macd=fast.map((v,i)=>v-slow[i]);
 const signal=ema(macd,9);
 const hist=macd.map((v,i)=>v-signal[i]);

 const a=macd.slice(-visible);
 const b=signal.slice(-visible);
 const bars=hist.slice(-visible);
 const right=86,plotW=w-right;
 const all=[...a,...b,...bars];
 const max=Math.max(...all.map(Math.abs),.000001);
 const x=i=>(i+.5)*plotW/Math.max(1,a.length);
 const y=v=>h/2-v/max*(h*.42);

 ctx.strokeStyle="#3d506b";
 ctx.beginPath();
 ctx.moveTo(0,h/2);
 ctx.lineTo(plotW,h/2);
 ctx.stroke();

 bars.forEach((v,i)=>{
  ctx.fillStyle=v>=0?"#18c88c":"#f15a6b";
  const yy=y(v);
  ctx.fillRect(
   x(i)-2,Math.min(yy,h/2),
   4,Math.max(1,Math.abs(yy-h/2))
  );
 });

 drawLine(ctx,a,x,y,"#6bb9ff",1.7);
 drawLine(ctx,b,x,y,"#f4c94d",1.7);
}

function drawAll(){
 $("price").textContent=format(price);
 drawChart();
 drawRSI();
 drawMACD();
}

function updateCountdown(){
 const remaining=timeframe-
  (Math.floor(Date.now()/1000)%timeframe);
 $("countdown").textContent=
  String(Math.floor(remaining/60)).padStart(2,"0")+
  ":"+String(remaining%60).padStart(2,"0");
}

function updatePrice(){
 price=Math.max(.00001,price+randomMove());
 ticks.push({t:Date.now(),p:price});
 if(ticks.length>MAX_TICKS)ticks.shift();
 rebuild();
 updateCountdown();
}

document.querySelectorAll("[data-tf]").forEach(btn=>{
 btn.onclick=()=>{
  timeframe=Number(btn.dataset.tf);
  document.querySelectorAll("[data-tf]")
   .forEach(b=>b.classList.toggle(
    "active",b===btn
   ));
  rebuild();
  updateCountdown();
 };
});

$("zoomIn").onclick=()=>{
 visible=Math.max(12,visible-10);
 drawAll();
};
$("zoomOut").onclick=()=>{
 visible=Math.min(150,visible+10);
 drawAll();
};
$("reset").onclick=()=>{
 visible=55;
 timeframe=60;
 document.querySelectorAll("[data-tf]")
  .forEach(b=>b.classList.toggle(
   "active",b.dataset.tf==="60"
  ));
 rebuild();
 updateCountdown();
};
$("ma").onchange=drawAll;
$("bb").onchange=drawAll;
$("pair").onchange=()=>{
 price=BASE[$("pair").value];
 makeHistory();
};

window.addEventListener("resize",drawAll);

makeHistory();
updateCountdown();
setInterval(updatePrice,1000);
setInterval(updateCountdown,250);
</script>
</body>
</html>
